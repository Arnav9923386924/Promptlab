# PromptLab Example Configuration
# Copy this to promptlab.yaml and customize for your setup.
# API keys are loaded from .env file via ${VAR} expansion — never hardcode secrets here.
#
# Quick start:
#   1. Copy this file:      cp promptlab.example.yaml promptlab.yaml
#   2. Create .env file:    echo "GOOGLE_API_KEY=AIza..." > .env
#   3. Edit bsp.txt with your prompt behavior rules
#   4. Run:                 promptlab validate
version: 1

# =============================================================================
# BEHAVIOR SPECIFICATION PROMPT (BSP)
# =============================================================================
bsp:
  prompt_file: bsp.txt
  min_score: 0.7
  version: "1.0.0"
  auto_generate: true
  auto_generate_count: 50
  # generation_mode: "web" (scraping only) or "hybrid" (scraping + synthetic variants)
  generation_mode: web

# =============================================================================
# MODELS
# =============================================================================
models:
  # The LLM to test
  default: ollama/llama3.1:8b
  
  # LLM for generating test cases (optional, falls back to default)
  generator: ollama/llama3.1:8b
  
  providers:
    # Local Ollama (Free)
    ollama:
      endpoint: http://localhost:11434
    
    # OpenRouter - Access many models with one key
    # openrouter:
    #   api_key: ${OPENROUTER_API_KEY}
    
    # OpenAI Direct
    # openai:
    #   api_key: ${OPENAI_API_KEY}
    
    # Anthropic Claude Direct
    # anthropic:
    #   api_key: ${ANTHROPIC_API_KEY}
    
    # Google Gemini Direct
    # google:
    #   api_key: ${GOOGLE_API_KEY}
    
    # xAI Grok Direct
    # xai:
    #   api_key: ${XAI_API_KEY}

# =============================================================================
# LLM COUNCIL
# =============================================================================
council:
  enabled: true
  mode: fast  # Options: full | fast | vote
  members:
    - ollama/llama3.1:8b
    - ollama/llama3.2:3b  # Use any models you have installed
  chairman: ollama/llama3.1:8b  # Makes final decision
  # Minimum successful judge scores required (default: 2, min: 2)
  required_judges: 2
  # Strict mode: only use configured members, no fallback to pool
  use_fixed_judges: false
  # Show raw judge responses for debugging
  debug_judge_responses: false
  # Console verbosity: show detailed per-model attempts (default: false)
  verbose_attempts: false
  # File logging: write detailed judge attempts to .promptlab/runs/ (default: true)
  log_attempts: true
  # Custom log file path (auto-generated if null)
  log_attempts_path: null

# =============================================================================
# BASELINE
# =============================================================================
baseline:
  storage_dir: .promptlab/baselines
  auto_update: true
  min_improvement: 0.01

# =============================================================================
# GIT INTEGRATION
# =============================================================================
git:
  enabled: true
  branch: null
  commit_template: "chore: BSP validation passed (score: {score:.2f}, improvement: +{improvement:.2f})"
  auto_push: false

# =============================================================================
# TESTING
# =============================================================================
testing:
  parallelism: 5
  timeout_ms: 180000
  retries: 2

# =============================================================================
# WEB SCRAPER (for auto-generating test cases)
# =============================================================================
scraper:
  serpapi_key: ${SERPAPI_KEY}
  max_pages: 10
  timeout: 30

